id = "completions"
label = "Completions"
category = "LLM"
platform = "deepinfra"
endpoint = "deepinfra/completions"
description = "Openai Completions"

[pricing]
note = "unset — take the price from the provider's own pricing page before shipping"

[general]
kind = "text"
prompt = "required"

[params.fail_fast]
label = "Fail_fast"
type = "boolean"
default = false
note = "If true, the request is rejected immediately with HTTP 429 when the model has no spare capacity, instead of waiting in the queue. Opt-in; the default (false) keeps standard queueing behavior."

[params.model]
label = "Model"
type = "text"
note = "model name"

[params.temperature]
label = "Temperature"
type = "number"
default = 1.0
min = 0.0
max = 2.0
note = "What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic"

[params.top_p]
label = "Top_p"
type = "number"
default = 1.0
max = 1.0
note = "An alternative to sampling with temperature, called nucleus sampling, where the model considers the results of the tokens with top_p probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered."

[params.min_p]
label = "Min_p"
type = "number"
default = 0.0
min = 0.0
max = 1.0
note = "Float that represents the minimum probability for a token to be considered, relative to the probability of the most likely token. Must be in [0, 1]. Set to 0 to disable this."

[params.top_k]
label = "Top_k"
type = "integer"
default = 0
min = 0.0
note = "Sample from the best k (number of) tokens. 0 means off"

[params.n]
label = "N"
type = "integer"
default = 1
min = 1.0
max = 4.0
note = "number of sequences to return"

[params.presence_penalty]
label = "Presence_penalty"
type = "number"
default = 0
min = -2.0
max = 2.0
note = "Positive values penalize new tokens based on whether they appear in the text so far, increasing the model's likelihood to talk about new topics."

[params.frequency_penalty]
label = "Frequency_penalty"
type = "number"
default = 0
min = -2.0
max = 2.0
note = "Positive values penalize new tokens based on how many times they appear in the text so far, increasing the model's likelihood to talk about new topics."

[params.repetition_penalty]
label = "Repetition_penalty"
type = "number"
default = 1
min = 0.01
max = 5.0
note = "Alternative penalty for repetition, but multiplicative instead of additive (> 1 penalize, < 1 encourage)"
